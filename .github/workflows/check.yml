name: Check tennis slots

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions:
  contents: write             # to save state.json (which slots were already reported)

concurrency:
  group: tennis-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_slots.py
      - name: Save state
        run: |
          git config user.name "slot-watcher"
          git config user.email "slot-watcher@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update slot state" && git push)
